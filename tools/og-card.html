<!doctype html>
<!--
  Source for assets/images/ruood-social-card.png, rendered at 1200×630 by
  tools/make-icons.mjs. This file is never deployed, which is why it may use
  a <style> block that the site itself is not allowed.

  Deliberately no product imagery and no claim: the wordmark, a hairline and
  the status. What a social platform shows beside it is the page title, which
  says the rest.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>RUŌOD social card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #14120F;
    color: #F2EDE4;
    font-family: Constantia, "Palatino Linotype", Palatino, Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    width: 1100px; height: 1100px;
    left: 50px; top: -300px;
    background: radial-gradient(circle at 50% 50%,
                rgba(201, 168, 106, 0.20), rgba(201, 168, 106, 0) 62%);
  }
  .card { position: relative; text-align: center; }
  .mark {
    font-size: 92px;
    letter-spacing: 0.38em;
    text-indent: 0.38em;
    line-height: 1;
  }
  .o { color: #C9A86A; }
  .rule {
    width: 180px; height: 1px;
    margin: 46px auto;
    background: linear-gradient(to right,
                rgba(201, 168, 106, 0), #C9A86A, rgba(201, 168, 106, 0));
  }
  .status {
    font-family: "Segoe UI", -apple-system, Arial, sans-serif;
    font-size: 19px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #B3A895;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <div class="mark">RU<span class="o">Ō</span>OD</div>
    <div class="rule"></div>
    <div class="status">A fragrance house &nbsp;·&nbsp; Opening soon</div>
  </div>
</body>
</html>
